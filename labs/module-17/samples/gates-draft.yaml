# Fixture for Module 17 (Lab 17.1). A draft of the gate criteria for the Module 16 pipeline.
# Do not copy as-is; find what is wrong, then write your own gates.yaml v1.0.0.

gates:
  G1_requirement_ready:            # after Requirement Validator
    checks:
      - envelope.status == "PASS"
      - requirement looks complete and unambiguous
      - every AC has classification == TESTABLE
    on_fail: retry_producer
    max_rounds: 3

  G2_sequence_coverage:            # after Sequence Builder
    checks:
      - the sequence covers the requirement well
      - every scenario's expect list is realistic
    on_fail: retry_producer
    max_rounds: 5

  G3_tests_collect_and_conform:    # after Test Generator
    checks:
      - cmd: pytest tests/ -q
      - tests look correct
    on_fail: llm_judge             # ask a model whether the tests seem good

  G4_no_test_defects:              # after API Validator
    checks:
      - no failures at all
      - cmd: echo "all good"       # placeholder — swap in something later
    on_fail: retry_producer
    max_rounds: 4

  G5_review_verdict:               # after Reviewer
    checks:
      - verdict in [APPROVE, ESCALATE] or whatever the reviewer decided
    on_fail: retry_producer
